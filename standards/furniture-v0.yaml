# standards/furniture-v0.yaml — luật + tham số của chuẩn trình bày v0.
# Sửa luật/ngưỡng = tạo PHIÊN BẢN CHUẨN MỚI (furniture-v0.1...), không sửa đè. Giá trị mặc định ở `globals` là đề xuất, công ty quyết (xem furniture-v0.md mục 6).
# `implemented: true` chỉ khi có hàm luật trong packages/core/cadguard/rules và có test (tests/test_rules.py kiểm điều này).
name: furniture-v0
version: 0.1.0
description: 'Chuẩn trình bày bản vẽ nội thất bản v0 (đề xuất, chưa phải chuẩn của công ty nào cho tới khi CEO + trưởng phòng kỹ thuật duyệt). Nội dung đầy đủ: standards/furniture-v0.md.'
globals:
  expected_units: 4
  layer_pattern: ^FN-[A-Z0-9]+-[A-Z0-9]+(-[NEDT])?$
  layer_extra_patterns:
  - ^FN-CNC-[A-Z0-9_]+$
  - ^FN-VPRT$
  layer_reserved:
  - '0'
  - DEFPOINTS
  not_plotted_layers:
  - FN-VPRT
  allowed_text_styles:
  - STD
  - TITLE
  title_block_names:
  - FN_TTLB
  title_block_required_attribs:
  - DWG_NO
  - TITLE
  - PROJECT
  - SHEET
  - SCALE
  - DRAWN_BY
  - CHECKED_BY
  - DATE
  - REV
  - STATUS
  - STD_VER
  part_tag_attrib: PART_ID
  preferred_scales:
  - 1
  - 0.5
  - 0.2
  - 0.1
  - 0.05
  - 0.02
  - 0.01
  - 2
  - 5
  - 10
  scale_tolerance: 0.005
  zero_tolerance: 1.0e-06
rules:
- id: SH-01
  title: Mỗi layout có khung khổ A-series nhận diện được
  reads: khổ giấy layout, polyline khung
  kind: deterministic
  severity: E
  false_positive_risk: low
  source: TCVN 7285
  implemented: false
  enabled: true
  realtime_ok: false
- id: SH-02
  title: Lề khung 20 mm trái, 10 mm các cạnh còn lại
  reads: đỉnh polyline khung
  kind: deterministic
  severity: W
  false_positive_risk: medium
  source: TCVN 7285
  implemented: false
  enabled: true
  realtime_ok: false
- id: SH-03
  title: Nét khung 0,7 mm
  reads: độ dày nét
  kind: deterministic
  severity: W
  false_positive_risk: low
  source: TCVN 7285
  implemented: false
  enabled: true
  realtime_ok: false
- id: SH-04
  title: Có đúng một khối khung tên chuẩn trên mỗi layout đã dùng (bỏ qua layout trống mặc định của CAD)
  reads: INSERT, tên khối
  kind: deterministic
  severity: E
  false_positive_risk: low
  source: ISO 7200
  implemented: true
  enabled: true
  realtime_ok: false

cau_hoi: >-
  Bản vẽ trong thư mục làm việc còn bao nhiêu layer dư từ xref (tên có '|' hoặc '$0$')?
  Dựa vào kết quả luật của chuẩn design-hygiene-v0, không tự đoán.
  Trả lời JSON với các trường so_layer_du_xref, ma_luat (mã luật căn cứ), thong_diep (danh sách).

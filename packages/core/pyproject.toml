[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadguard"
version = "0.1.0"
description = "cad-guard: kiểm tra và chuẩn hoá bản vẽ nội thất theo luật tất định (lõi, chạy cục bộ, không cần LLM)"
requires-python = ">=3.10"
dependencies = [
  "ezdxf>=1.3",
  "pydantic>=2.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cadguard = "cadguard.cli:main"

[tool.setuptools.packages.find]
include = ["cadguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
